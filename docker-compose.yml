version: '3.4'

services:
  golinks.webapi:
    image: ${DOCKER_REGISTRY-}golinkswebapi
    build:
      context: .
      dockerfile: Golinks.WebAPI/Dockerfile
    depends_on:
      - golinks.postgres
      - golinks.seq
    networks:
      - golinks_network

  golinks.postgres:
    image: postgres:16.4
    container_name: golinks.postgres
    environment:
      POSTGRES_USER: golinks_app_user
      POSTGRES_PASSWORD: YourStrong!Passw0rd
      POSTGRES_DB: golinks
    ports:
      - "5432:5432"
    networks:
      - golinks_network
    volumes:
      - golinks_postgres:/var/lib/postgresql/data

  golinks.seq:
    image: datalust/seq:latest
    container_name: golinks.seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: "QAsBtwO3/cyKAPcALv6Fa1r879ADuTvsKm/D4jpFPXpRtF/MAnPX0r62u1HpznrBSBxMckFsGx+mbWxxnPwf36oxO4KkCpGUgfodLVxIUOeN"
    ports:
      - "5341:5341"
      - "8082:80"
    networks:
      - golinks_network
    volumes:
      - golinks_seq:/data

  golinks.adminer:
    image: adminer:latest
    container_name: golinks.adminer
    ports:
      - "9090:8080"
    depends_on:
      - golinks.postgres
    networks:
      - golinks_network

networks:
  golinks_network:
    driver: bridge

volumes:
  golinks_postgres:
  golinks_seq:
  